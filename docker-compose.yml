# Local dev datastores only. In production these are Railway managed plugins.
# Usage: docker compose up -d  → then `npm run migrate` → `npm start` / `npm run worker`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: anime_op
    ports:
      - "5432:5432"
    volumes:
      - anime_op_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - anime_op_redis:/data

volumes:
  anime_op_pg:
  anime_op_redis:
